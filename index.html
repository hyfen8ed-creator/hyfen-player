<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyFen Player - Free Open-Source YouTube Work Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶️</text></svg>">
  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 antialiased selection:bg-red-500 selection:text-white">
  
  <div class="max-w-4xl mx-auto w-full bg-[#131b2b] border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl backdrop-blur-lg">
    
    <!-- Top Header -->
    <header class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-700 to-red-500 flex items-center justify-center text-white shadow-lg shadow-red-600/30">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            HyFen Player
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-semibold border border-emerald-500/20">Remote Work Ready</span>
          </h1>
          <p class="text-xs text-slate-400">Distraction-free &bull; Ad-minimizing &bull; Privacy & Proxy embed</p>
        </div>
      </div>

      <!-- Quick Preset Buttons -->
      <div class="flex items-center gap-2 text-xs">
        <button onclick="loadVideo('jfKfPfyJRdk', 'Lofi Girl - Relax/Study')" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 transition border border-slate-700/80 text-slate-300 hover:text-white flex items-center gap-1">
          ☕ Lofi
        </button>
        <button onclick="loadVideo('5qap5aO4i9A', 'Lofi Synthwave Radio')" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 transition border border-slate-700/80 text-slate-300 hover:text-white flex items-center gap-1">
          🌃 Synth
        </button>
        <button onclick="loadVideo('WPni755-Krg', 'Binaural Focus Beats')" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 transition border border-slate-700/80 text-slate-300 hover:text-white flex items-center gap-1">
          🧠 Focus
        </button>
      </div>
    </header>

    <!-- Search / URL Input Bar -->
    <div class="mt-4 flex flex-col sm:flex-row gap-2">
      <div class="relative flex-1">
        <input 
          id="videoInput" 
          type="text" 
          placeholder="Paste any YouTube URL, youtu.be, or video ID..." 
          class="w-full bg-[#0b0f17] text-white border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 transition placeholder-slate-500"
          onkeydown="if(event.key==='Enter') handlePlaySubmit()"
        />
        <button 
          onclick="clearInput()" 
          id="clearBtn" 
          class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white hidden">
          ✕
        </button>
      </div>
      <div class="flex gap-2">
        <button 
          onclick="handlePlaySubmit()" 
          class="flex-1 sm:flex-none px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-medium text-sm rounded-xl transition shadow-lg shadow-red-600/30 flex items-center justify-center gap-1.5 active:scale-95">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Play
        </button>
        <button 
          onclick="toggleHistory()" 
          title="Watch History"
          class="px-3.5 py-2.5 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white text-sm rounded-xl transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Options and Engine Switcher -->
    <div class="mt-3 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2">
      <div class="flex items-center gap-4">
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-slate-200">
          <input type="checkbox" id="autoplayCheck" checked class="rounded border-slate-700 bg-slate-900 text-red-600 focus:ring-red-500">
          <span>Autoplay</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-slate-200">
          <input type="checkbox" id="loopCheck" class="rounded border-slate-700 bg-slate-900 text-red-600 focus:ring-red-500">
          <span>Loop Track</span>
        </label>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-slate-400">Stream Engine:</span>
        <select id="engineSelect" onchange="switchEngine()" class="bg-[#0b0f17] text-slate-200 border border-slate-700 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-red-500">
          <option value="youtube-nocookie">YouTube Privacy Embed (Default)</option>
          <option value="youtube-standard">YouTube Standard Embed</option>
          <option value="invidious-yewtu">Invidious Proxy (yewtu.be)</option>
          <option value="invidious-nerdvpn">Invidious Proxy (nerdvpn.de)</option>
        </select>
      </div>
    </div>

    <!-- Main Video Frame -->
    <div class="mt-4 relative rounded-xl overflow-hidden border border-slate-800 bg-black shadow-2xl aspect-video flex items-center justify-center">
      <iframe 
        id="playerFrame" 
        class="w-full h-full absolute inset-0 border-0" 
        src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=0&rel=0&modestbranding=1" 
        title="HyFen YouTube Player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- Video Sub-bar -->
    <div class="mt-3 flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800/80">
      <div class="text-xs truncate max-w-md">
        <span class="text-slate-500">Currently Loaded:</span> 
        <span id="currentTitle" class="font-medium text-slate-200 ml-1">Lofi Girl - Relax/Study</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <button onclick="popoutWindow()" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 flex items-center gap-1.5 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          Popout Window
        </button>
        <button onclick="openOnYouTube()" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 flex items-center gap-1.5 transition">
          Direct Link
        </button>
      </div>
    </div>

    <!-- History Drawer -->
    <div id="historyDrawer" class="mt-4 pt-3 border-t border-slate-800 hidden">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Recently Played</span>
        <button onclick="clearHistory()" class="text-[11px] text-red-400 hover:text-red-300">Clear</button>
      </div>
      <div id="historyList" class="max-h-40 overflow-y-auto space-y-1.5 text-xs pr-1">
        <!-- Rendered items -->
      </div>
    </div>

  </div>

  <footer class="mt-6 text-center text-xs text-slate-500">
    <p>HyFen Open Source Web Player &bull; Open-source &bull; Zero telemetry &bull; <a href="https://github.com" target="_blank" class="text-slate-400 hover:underline">Host on GitHub Pages</a></p>
  </footer>

  <script>
    let currentVideoId = 'jfKfPfyJRdk';
    let currentPlaylistId = null;

    function getStoredHistory() {
      try {
        return JSON.parse(localStorage.getItem('hyfen_yt_history') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveToHistory(id, title) {
      try {
        let history = getStoredHistory().filter(item => item.id !== id);
        history.unshift({ id, title: title || `Video: ${id}`, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
        if (history.length > 20) history.pop();
        localStorage.setItem('hyfen_yt_history', JSON.stringify(history));
        renderHistory();
      } catch (e) {}
    }

    function renderHistory() {
      const listEl = document.getElementById('historyList');
      const history = getStoredHistory();
      if (!listEl) return;
      if (history.length === 0) {
        listEl.innerHTML = '<p class="text-slate-500 py-2 text-center text-xs">No watch history yet.</p>';
        return;
      }
      listEl.innerHTML = history.map(item => `
        <div class="flex items-center justify-between p-2 rounded-lg bg-[#0b0f17] border border-slate-800 hover:border-red-500/40 transition group">
          <div class="truncate mr-2 cursor-pointer flex-1" onclick="loadVideo('${item.id}', '${item.title.replace(/'/g, "\\'")}')">
            <span class="font-medium text-slate-200">${item.title}</span>
            <span class="text-[10px] text-slate-500 ml-2">${item.time}</span>
          </div>
          <button onclick="loadVideo('${item.id}', '${item.title.replace(/'/g, "\\'")}')" class="text-red-400 hover:text-red-300 text-xs px-2.5 py-0.5 rounded bg-red-500/10 hover:bg-red-500/20">Play</button>
        </div>
      `).join('');
    }

    function parseYouTubeUrl(url) {
      if (!url) return null;
      url = url.trim();

      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) {
        return { videoId: url };
      }

      const playlistMatch = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
      const playlistId = playlistMatch ? playlistMatch[1] : null;

      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);

      const videoId = (match && match[2].length === 11) ? match[2] : null;
      return { videoId, playlistId };
    }

    function buildEmbedUrl(videoId, playlistId) {
      const engine = document.getElementById('engineSelect').value;
      const autoplay = document.getElementById('autoplayCheck').checked ? '1' : '0';
      const loop = document.getElementById('loopCheck').checked ? '1' : '0';
      const loopParam = loop === '1' ? `&loop=1&playlist=${videoId || ''}` : '';

      if (engine === 'invidious-yewtu') {
        if (videoId) return `https://yewtu.be/embed/${videoId}?autoplay=${autoplay}`;
      } else if (engine === 'invidious-nerdvpn') {
        if (videoId) return `https://invidious.nerdvpn.de/embed/${videoId}?autoplay=${autoplay}`;
      } else if (engine === 'youtube-standard') {
        if (playlistId && !videoId) {
          return `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=${autoplay}`;
        }
        return `https://www.youtube.com/embed/${videoId}?autoplay=${autoplay}&rel=0&modestbranding=1${loopParam}`;
      }

      // Default: youtube-nocookie
      if (playlistId && !videoId) {
        return `https://www.youtube-nocookie.com/embed/videoseries?list=${playlistId}&autoplay=${autoplay}`;
      }
      return `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=${autoplay}&rel=0&modestbranding=1${loopParam}`;
    }

    function loadVideo(id, title) {
      currentVideoId = id;
      currentPlaylistId = null;
      const frame = document.getElementById('playerFrame');
      frame.src = buildEmbedUrl(id);
      document.getElementById('currentTitle').innerText = title || id;
      saveToHistory(id, title);
    }

    function handlePlaySubmit() {
      const input = document.getElementById('videoInput').value;
      if (!input) return;

      const parsed = parseYouTubeUrl(input);
      if (!parsed || (!parsed.videoId && !parsed.playlistId)) {
        alert('Could not recognize a valid YouTube URL or Video ID. Please check the link.');
        return;
      }

      if (parsed.videoId) {
        loadVideo(parsed.videoId, `YouTube Video (${parsed.videoId})`);
      } else if (parsed.playlistId) {
        currentPlaylistId = parsed.playlistId;
        const frame = document.getElementById('playerFrame');
        frame.src = buildEmbedUrl(null, parsed.playlistId);
        document.getElementById('currentTitle').innerText = `Playlist: ${parsed.playlistId}`;
      }
    }

    function switchEngine() {
      const frame = document.getElementById('playerFrame');
      frame.src = buildEmbedUrl(currentVideoId, currentPlaylistId);
    }

    function toggleHistory() {
      const drawer = document.getElementById('historyDrawer');
      drawer.classList.toggle('hidden');
      if (!drawer.classList.contains('hidden')) {
        renderHistory();
      }
    }

    function clearHistory() {
      localStorage.removeItem('hyfen_yt_history');
      renderHistory();
    }

    function clearInput() {
      document.getElementById('videoInput').value = '';
    }

    function popoutWindow() {
      const url = document.getElementById('playerFrame').src;
      window.open(url, 'HyFenPlayerPopout', 'width=840,height=500,menubar=no,toolbar=no,location=no,status=no');
    }

    function openOnYouTube() {
      if (currentVideoId) {
        window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
      }
    }

    renderHistory();
  </script>
</body>
</html>
